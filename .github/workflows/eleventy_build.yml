name: Eleventy Build
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rpcourse-updated]

permissions:
  contents: write
  pages: write

jobs:
  build_deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Sync rpcourse content (on dispatch from RP-course)
        if: github.event_name == 'repository_dispatch'
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/cni-iisc/RP-course.git /tmp/rpcourse-tmp
          rm -rf courses/rpcourse
          rm -rf courses/random
          mkdir courses/random
          cp -r /tmp/rpcourse-tmp/* courses/random
          rm -rf /tmp/rpcourse-tmp
          git config user.name "Akhil T"
          git config user.email "akhilneelamparambil@gmail.com"
          git add courses/random
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -sm "Sync rpcourse content from RP-course gh-pages"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Verify Eleventy version
        run: npx @11ty/eleventy --version

      - name: Build Eleventy
        run: npx @11ty/eleventy

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./docs
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
