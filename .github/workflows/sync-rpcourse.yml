name: Sync RP Course
on:
  repository_dispatch:
    types: [rpcourse-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cni_11ty
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch RP-course gh-pages content
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/cni-iisc/RP-course.git /tmp/rpcourse-tmp

      - name: Sync rpcourse content
        run: |
          rm -rf courses/rpcourse
          mkdir courses/rpcourse
          cp -r /tmp/rpcourse-tmp/* courses/rpcourse/
          rm -rf /tmp/rpcourse-tmp

      - name: Commit and push
        run: |
          git config user.name "Akhil T "
          git config user.email "akhilneelamparambil@gmail.com"
          git add courses/rpcourse/
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -sm "Sync rpcourse content from RP-course gh-pages"
            git push
          fi
