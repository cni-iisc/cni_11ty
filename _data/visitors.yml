# Visitors listing, consumed by the "Visitors" collection in .eleventy.js and
# rendered on the per-year listing pages (/visitors/<academic_year>/) and the
# per-visitor detail pages (/visitors/<academic_year>/<slug>/).
#
# Schema — only `name`, `slug` and `academic_year` are required; omit (or leave
# "" / []) any field you don't have yet. Long prose fields use YAML folded blocks
# (`>`), so keep the indentation two spaces deeper than the key; leave a blank
# line between paragraphs (each blank-separated block renders as its own <p>).
#
# The detail page now shows only these fields:
#   name, institution, profile_pic, website, google_scholar, visit_from/visit_to,
#   purpose, talk_event_page, engagements (text + images), extra_pics.
# The other fields below are still kept in the data (e.g. for the listing cards).
#
#   name                Full name as shown on the card.
#   slug                URL segment for the detail page, e.g. "puneet-sharma"
#                       (/visitors/<academic_year>/<slug>/). Keep it stable once
#                       published so links don't break.
#   institution         Affiliation during the visit.
#   designation         Role/title, e.g. "Professor and Director of ...".
#   academic_year       Integer START year of the academic year the visit belongs
#                       to (2025 => "2025-26"). Drives the year filter, the
#                       per-year pages and the dropdown.
#   visit_from          ISO date YYYY-MM-DD, first day of the visit.
#                       Keep the quotes ("2026-01-13") so YAML treats it as a
#                       string instead of parsing it into a timestamp.
#   visit_to            ISO date YYYY-MM-DD, last day of the visit. Omit it for a
#                       one-day visit — visit_from alone is then shown.
#   profile_pic         Portrait shown on the card and detail page. Keep it under
#                       the visitor's own folder (see `image layout` below).
#   website             Personal / institutional homepage.
#   google_scholar      Google Scholar profile URL.
#   linkedin            LinkedIn profile URL.
#   intro               Short blurb (not shown on the detail page anymore).
#   bio                 Full biography (not shown on the detail page anymore).
#   purpose             One-line purpose of the visit, including the seminar/
#                       workshop/event, e.g. "Visited CNI to deliver a seminar talk on ...".
#   talk_title          Title of the talk they gave, if any.
#   talk_description    Abstract / short description of the talk.
#   talk_event_page     URL of the seminar/event page for the talk.
#   research_interests  List of short research-interest strings.
#   engagements         List of engagement rows. Each entry is:
#                         text:   the sentence(s) shown under "Engagements at CNI"
#                         images: list of image paths; they appear in the Photos
#                                 section along with extra_pics.
#   end_note            Closing / thank-you paragraph.
#   extra_pics          List of additional visit photos shown in the Photos section.
#
# Image layout: every visitor keeps ALL their images in a per-visitor folder
#   /assets/images/people/visitors/<academic_year>/<slug>/
# and references them with root-relative paths, e.g.
#   /assets/images/people/visitors/2025/puneet-sharma/profile.jpg
# All of them go through the site-wide eleventy-img optimization pipeline.
#
# Order in this file doesn't matter. The collection sorts by academic_year
# (newest first), then visit_from (newest first), then name.

