- name: Andres Kwasinski
  slug: andres-kwasinski
  institution: Rochester Institute of Technology
  designation: Professor and Director of the Ph.D. Program in Electrical and Computer Engineering
  academic_year: 2025
  visit_from: "2026-01-13"
  visit_to: "2026-01-14"
  profile_pic: /assets/images/people/visitors/2025/andres-kwasinski/profile.jpg
  website: https://www.rit.edu/directory/axkeec-andres-kwasinski
  google_scholar: https://scholar.google.com/citations?user=tSzRv0YAAAAJ&hl=en
  linkedin: ""
  intro: >
    CNI recently hosted Professor Andres Kwasinski, who is a Professor and Director of
    the Ph.D. program in Electrical and Computer Engineering at the Rochester Institute
    of Technology, Rochester, NY, USA. During his visit, he engaged with the CNI
    community through a seminar talk.
  bio: >
    Andres Kwasinski is a Professor and Director of the Ph.D. program in Electrical
    and Computer Engineering at the Rochester Institute of Technology, Rochester, NY,
    USA. He has co-authored more than 110 peer-reviewed publications and four books
    published by Cambridge University Press and Wiley. He currently serves on the
    Senior Editorial Board of the IEEE Signal Processing Magazine, where he has also
    been Area Editor and Associate Editor. He has previously served as an Editor for
    IEEE Transactions on Wireless Communications and IEEE Wireless
    Communications Letters.

    He received the Diploma in Electrical Engineering from the Buenos Aires Institute of
    Technology, Argentina, and the M.Sc. and Ph.D. degrees in Electrical and Computer
    Engineering from the University of Maryland, College Park, USA. Dr. Kwasinski is a
    Senior Member of the IEEE.
  purpose: The visit was part of the CNI seminar series.
  talk_title: >
    The Synergy Between Quality of Experience and Deep Reinforcement Learning for
    Uncoordinated Multi-Agent Resource Allocation in Cognitive Radio Network
  talk_description: >
    How quality-of-experience–driven metrics can be combined with deep reinforcement
    learning to enable efficient, adaptive resource allocation in uncoordinated
    multi-agent cognitive radio networks.
  talk_event_page: https://cni.iisc.ac.in/seminars/2026-01-14/
  research_interests:
    - Cognitive radios and wireless networks
    - Cross-layer techniques in wireless communications
    - Smart infrastructures and networking
  engagements:
    - text: >
        During their time at CNI, Professor Andres interacted with faculty through
        research discussion and with students through a seminar talk.
      images: []
  end_note: >
    We were glad to host Professor Andres Kwasinski at CNI and appreciate their
    thoughtful perspectives and contributions to ongoing conversations around cognitive
    radio networks, multi-agent systems, and learning-driven resource allocation. Interactions
    like these continue to strengthen CNI’s role as a hub for networked intelligence research.
  extra_pics: []

