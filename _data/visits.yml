# Outreach visits: visits by CNI members to external organizations. Consumed by
# the "Visits" collection in .eleventy.js and rendered on the per-year listing
# pages (/visits/<academic_year>/) and the per-visit detail pages
# (/visits/<academic_year>/<slug>/). Listed under Outreach > Visits in the navbar.
#
# Source: "Faculty Academic Outreach_Talks and Visits.xlsx" (sheet DataForWebpage)
# on the CNI-Outreach-Visits SharePoint site.
#
# Schema — only `organization`, `slug` and `academic_year` are required; omit any
# field you don't have. Long prose fields use YAML folded blocks (`>`); leave a
# blank line between paragraphs.
#
#   organization        Organization / institute visited, shown as "Visit to <organization>".
#   slug                URL segment for the detail page (/visits/<academic_year>/<slug>/).
#                       Keep it stable once published so links don't break.
#   member              CNI member who made the visit, e.g. "Prof. Parimal Parag".
#   member_designation  Role of the member, shown on the detail page.
#   member_url          Optional homepage for the member; the name links to it.
#   academic_year       Integer START year of the academic year of the visit
#                       (Jan 2025 => 2024, i.e. "2024-25"). Drives the year pages and dropdown.
#   visit_from          ISO date YYYY-MM-DD, first day of the visit (keep the quotes).
#   visit_to            ISO date YYYY-MM-DD, last day. Omit for a one-day visit.
#   thumbnail           Picture of the organization, shown on the card and the detail page.
#   purpose             Paragraph on the purpose of the visit and key engagements.
#   event_page          Optional URL of the talk / event page.
#   photos              List of photos from the visit, shown in the Photos section.
#
# Image layout: each visit keeps its images in its own folder
#   /assets/images/outreach/visits/<academic_year>/<slug>/
# All of them go through the site-wide eleventy-img optimization pipeline.
#
# Order in this file doesn't matter. The collection sorts by academic_year
# (newest first), then visit_from (newest first), then organization.

