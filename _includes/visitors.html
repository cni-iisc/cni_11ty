---
layout: base.html
---
<link rel="stylesheet" href="/assets/css/people.css">
<style>
.carousel-control-prev-icon,
.carousel-control-next-icon {
  filter: invert(1) drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
}
</style>

{% if category == "Visitors" %}
{% set cat = "Visitors" %}
{% else %}
{% set cat = "Guests" %}
{% endif %}

<script id="visitors-config" type="application/json">
{
  "spreadsheetId": "2PACX-1vTpJtozYcDR8ozYoFmkesLEElO6ajo8Snp9RN26uEQcvCnIOtwokd_Xs5YNg6gT14Oo0MSm-T_RaZvL",
  "tabs": {
    "2026": 0,
    "2025": 123456789,
    "2024": 987654321,
    "2023": 111111111
  },
  "activeTab": {{ year | dump | safe }}
}
</script>

<div class="container-fluid text-center mt-2" style="max-width:1200px;">
  <h2>{{ cat }} to CNI</h2>
  <div class="dropdown text-center">
    <button class="btn dropdown-toggle button-year" type="button" id="yearDropdown" data-bs-toggle="dropdown"
      aria-expanded="false">
      <span id="selectedYear">{{ year }}-{{ year + 1 }}</span>
    </button>
    <ul class="dropdown-menu text-center" aria-labelledby="yearDropdown">
      <li><a class="dropdown-item" href="/{{ cat | lower }}/" data-year="2026">2026-2027</a></li>
      <li><a class="dropdown-item" href="/{{ cat | lower }}-2023/" data-year="2023">2023-2024</a></li>
    </ul>
  </div>
  <div id="visitors-container" class="row justify-content-center gap-0">
    <div class="col-12 text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var configEl = document.getElementById('visitors-config');
  if (!configEl) return;
  var config;
  try { config = JSON.parse(configEl.textContent); } catch(e) { return; }

  var gid = config.tabs && config.tabs[config.activeTab];
  if (gid === undefined || gid === null) { document.getElementById('visitors-container').innerHTML = '<div class="col-12 text-center py-5 text-muted">No visitor data configured for this year.</div>'; return; }

  var url = 'https://docs.google.com/spreadsheets/d/e/' + config.spreadsheetId + '/pub?gid=' + gid + '&single=true&output=csv';
  var allRows = [];

  fetch(url)
    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
    .then(function(csv) {
      allRows = parseCSV(csv);
      renderView();
    })
    .catch(function(err) {
      document.getElementById('visitors-container').innerHTML = '<div class="col-12 text-center py-5 text-danger">Failed to load visitors: ' + escapeHtml(err.message) + '</div>';
    });

  window.addEventListener('hashchange', renderView);

  function renderView() {
    var hash = window.location.hash.replace(/^#\/?/, '').replace(/\/$/, '');
    if (hash) {
      showDetail(hash);
    } else {
      showList();
    }
  }

  function showList() {
    var container = document.getElementById('visitors-container');
    if (allRows.length === 0) {
      container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No visitors found for this year.</div>';
      return;
    }
    container.innerHTML = '';
    allRows.forEach(function(row) {
      if (!row.name) return;
      var slug = slugify(row.name);
      var card = document.createElement('div');
      card.className = 'col-lg-3 col-sm-6 mb-2 d-flex justify-content-center gap-0';
      card.innerHTML = [
        '<a href="#/' + escapeAttr(slug) + '/" class="text-decoration-none">',
        '<div class="card mb-4 staff-card">',
        '<img src="' + escapeAttr(row.img || '/assets/img/Logos/cni_blue_round_1200x1200.png') + '" alt="' + escapeAttr(row.name) + '" class="card-img-top img-fluid">',
        '<div class="staff-card-body lh-sm">',
        '<h6 class="card-title mt-2">' + escapeHtml(row.name) + '</h6>',
        row.institution ? '<p style="color: var(--hover-clr);">' + escapeHtml(row.institution) + '</p>' : '',
        '</div></div>',
        '</a>',
      ].join('');
      container.appendChild(card);
    });
  }

  function showDetail(slug) {
    var visitor = null;
    for (var i = 0; i < allRows.length; i++) {
      if (slugify(allRows[i].name) === slug) { visitor = allRows[i]; break; }
    }
    var container = document.getElementById('visitors-container');
    if (!visitor) {
      container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Visitor not found. <a href="#/" onclick="window.location.hash=\'\';return false;">Back to all visitors</a></div>';
      return;
    }
    var interests = visitor.research_interests ? visitor.research_interests.split('|').map(function(s) { return s.trim(); }).filter(Boolean) : [];
    container.innerHTML = [
      '<div class="container-fluid mt-4" style="max-width: 900px; text-align: justify;">',
      '<div class="text-start mb-3" style="text-align: left;"><a href="#/" onclick="window.location.hash=\'\';return false;">&larr; Back to all visitors</a></div>',
      visitor.intro ? '<div class="mb-3"><p>' + escapeHtml(visitor.intro) + '</p></div>' : '',
      '<div class="text-center mb-3" style="text-align: center;">',
      '<h2>' + escapeHtml(visitor.name) + '</h2>',
      visitor.institution ? '<h5 class="text-muted">' + escapeHtml(visitor.institution) + '</h5>' : '',
      '</div>',
      visitor.visit_dates ? '<p class="text-center text-secondary" style="text-align: center;"><strong>Visit Dates:</strong> ' + escapeHtml(visitor.visit_dates) + '</p>' : '',
      visitor.img ? '<div class="text-center mb-4" style="text-align: center;"><img src="' + escapeAttr(visitor.img) + '" alt="' + escapeAttr(visitor.name) + '" class="img-fluid rounded" style="max-height:300px;"></div>' : '',
      visitor.bio ? '<div class="mb-4"><p><strong>Bio:</strong> ' + escapeHtml(visitor.bio).replace(/\n/g, '<br>') + '</p></div>' : '',
      (interests.length || visitor.google_scholar || visitor.website) ? '<div class="mb-4"><h4>Research Background</h4>' : '',
      interests.length ? '<p>Their research interests include:</p><ul>' + interests.map(function(i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>' : '',
      (visitor.google_scholar || visitor.website) ? '<p><strong>Read More:</strong><br>' : '',
      visitor.google_scholar ? 'Google Scholar: <a href="' + escapeAttr(visitor.google_scholar) + '" target="_blank">' + escapeHtml(visitor.google_scholar) + '</a><br>' : '',
      visitor.website ? 'Professional Website: <a href="' + escapeAttr(visitor.website) + '" target="_blank">' + escapeHtml(visitor.website) + '</a>' : '',
      (visitor.google_scholar || visitor.website) ? '</p>' : '',
      (interests.length || visitor.google_scholar || visitor.website) ? '</div><hr style="margin-top: 2.5rem; margin-bottom: 1.5rem; border: 0; border-top: 1px solid #ccc;">' : '',
      visitor.purpose_intro || visitor.talk_title ? '<div class="mb-3"><p>' : '',
      visitor.purpose_intro ? escapeHtml(visitor.purpose_intro) + ' ' : '',
      visitor.talk_title ? 'During the visit, ' + escapeHtml(visitor.name) + ' delivered a talk titled <strong>&ldquo;' + escapeHtml(visitor.talk_title) + '&rdquo;</strong>' + (visitor.talk_description ? ', where they discussed ' + escapeHtml(visitor.talk_description) : '') + '.' : '',
      visitor.purpose_intro || visitor.talk_title ? '</p></div>' : '',
      visitor.event_page ? '<p>Read more here: <a href="' + escapeAttr(visitor.event_page) + '" target="_blank">' + escapeHtml(visitor.event_page) + '</a></p>' : '',
      visitor.engagements ? '<div class="mb-4"><p>' + escapeHtml(visitor.engagements) + '</p></div>' : '',
      visitor.photos_of_visit ? (function() { var photos = visitor.photos_of_visit.split(',').map(function(u) { return u.trim(); }).filter(Boolean); if (photos.length === 0) return ''; var id = 'carousel-' + slugify(visitor.name); var items = photos.map(function(url, i) { var imgUrl = driveUrlToDirect(url); var proxied = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(imgUrl); return '<div class="carousel-item' + (i === 0 ? ' active' : '') + '"><div class="d-flex justify-content-center align-items-center" style="height: 400px;"><img src="' + escapeAttr(proxied) + '" alt="Visit photo" class="img-fluid rounded" style="max-height: 100%; width: auto; object-fit: contain;"></div></div>'; }).join(''); var indicators = photos.map(function(_, i) { return '<button type="button" data-bs-target="#' + id + '" data-bs-slide-to="' + i + '" class="' + (i === 0 ? 'active' : '') + '" aria-label="Photo ' + (i + 1) + '"></button>'; }).join(''); return '<div class="mb-4"><div id="' + id + '" class="carousel slide" data-bs-ride="carousel"><div class="carousel-indicators">' + indicators + '</div><div class="carousel-inner">' + items + '</div><button class="carousel-control-prev" type="button" data-bs-target="#' + id + '" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span></button><button class="carousel-control-next" type="button" data-bs-target="#' + id + '" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span></button></div></div>'; })() : '',
      visitor.end_note ? '<div class="mb-4"><p>' + escapeHtml(visitor.end_note) + '</p></div>' : '',
      '</div>',
    ].join('');
  }

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function driveUrlToDirect(url) {
    var m = url.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
    if (m) return 'https://drive.google.com/uc?export=view&id=' + m[1];
    return url;
  }

  function parseCSV(text) {
    var lines = [];
    var current = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { current.push(field); field = ''; }
        else if (c === '\n' || (c === '\r' && text[i + 1] === '\n')) { current.push(field); field = ''; if (current.some(Boolean) || current.length > 1) lines.push(current); current = []; if (c === '\r') i++; }
        else if (c === '\r') { current.push(field); field = ''; if (current.some(Boolean) || current.length > 1) lines.push(current); current = []; }
        else { field += c; }
      }
    }
    if (field || current.length) { current.push(field); if (current.some(Boolean) || current.length > 1) lines.push(current); }
    if (lines.length < 2) return [];
    var headers = lines[0].map(function(h) { return h.trim().toLowerCase().replace(/[^a-zA-Z0-9_]/g, ''); });
    var result = [];
    for (var r = 1; r < lines.length; r++) {
      var row = {};
      for (var c2 = 0; c2 < headers.length && c2 < lines[r].length; c2++) {
        row[headers[c2]] = lines[r][c2].trim();
      }
      result.push(row);
    }
    return result;
  }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escapeAttr(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
})();
</script>
